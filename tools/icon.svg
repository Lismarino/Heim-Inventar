<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Keepsy (2.1): eine schlichte Box mit Deckel – flach, Tannengrün auf warmem hellem Grund.
       Bleibt Tannengrün, auch wenn in der App eine andere Akzentfarbe gewählt ist (iOS-Symbole
       sind nicht dynamisch). Vollflächig ohne Ecken: iOS rundet selbst; der Inhalt liegt in der
       sicheren Zone für „maskable“ (Kreis mit 80 % Durchmesser). Erzeugen: node tools/icon.js -->
  <rect width="1024" height="1024" fill="#F6F3EC"/>
  <!-- Deckel -->
  <rect x="236" y="290" width="552" height="96" rx="30" fill="#2E6B4F"/>
  <!-- Box -->
  <rect x="272" y="412" width="480" height="326" rx="46" fill="#2E6B4F"/>
  <!-- Griffmulde -->
  <rect x="432" y="482" width="160" height="40" rx="20" fill="#F6F3EC"/>
</svg>
